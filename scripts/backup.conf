# backup.conf — settings for scripts/backup-memory.sh (sourced as bash).
# Environment variables of the same name override these values.

# Destination 1: local backup folder. <name> is the project folder name.
# Rule: every project's backups go in their OWN SUBFOLDER of ~/claude-backups/
# (~/claude-backups/<name>) — never a new top-level backup folder per project.
# BACKUP_DEST_1="$HOME/claude-backups/<name>"

# Destination 2: point this at a DIFFERENT physical place — cloud-synced
# folder (iCloud Drive, Dropbox), a NAS mount, or an external drive.
# Default is backups/ inside the project (git-ignored), which only protects
# against accidental edits, not against losing this disk. Same rule: one
# claude-backups folder at the destination, one subfolder per project.
# BACKUP_DEST_2="$HOME/Library/Mobile Documents/com~apple~CloudDocs/claude-backups/<name>"

# How many timestamped archives to keep in each destination.
# BACKUP_KEEP=30

# Extra paths to include, relative to the project root (space-separated),
# in addition to: CLAUDE.md record/ MISTAKES.md docs/ .claude/ templates/
# BACKUP_EXTRA_PATHS="handoff.md progress.md notes/"

# Include Claude Code's per-project auto-memory folder
# (~/.claude/projects/<project-path-slug>/memory) if it exists. 1 = yes.
# BACKUP_INCLUDE_CLAUDE_MEMORY=1
